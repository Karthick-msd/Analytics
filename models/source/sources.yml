# models/staging/sources.yml
version: 2

sources:
  - name: raw
    database: data_mart
    schema: default
    description: >
      Raw ingested source data, unmodified from origin systems.
      No validation, casting, or deduplication applied at this layer.
    loaded_at_field: file_modification_time
    
    tables:
      - name: bronze_web_sessions
        description: >
          Raw web session events loaded from CSV via Databricks Volumes.
          One row per session. Schema inferred at load time — types may
          drift if source CSV structure changes.

        tags: ['web', 'bronze', 'pii_review_pending']

        meta:
          owner: "karthick"
          team: "analytics_engineering"
          contains_pii: true
          source_system: "web_analytics_csv_export"
          source_file_path: "dbfs:/Volumes/data_mart/source/my_volume/web_sessions.csv"

        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

        columns:
          - name: session_id
            description: "Unique identifier for a web session event"
            data_tests:
              - unique
              - not_null

          - name: customer_id
            description: "FK to customer — links session to a specific individual"
            meta:
              contains_pii: true
            data_tests:
              - not_null

          - name: session_date
            description: >
              Date the session occurred, in DD-MM-YYYY string format from
              source (needs casting to date type in Silver layer).
            data_tests:
              - not_null

          - name: device_type
            description: "Device category used for the session (e.g. Desktop, Mobile, Tablet)"

          - name: pages_viewed
            description: "Count of pages viewed during the session"

          - name: duration_seconds
            description: "Total session duration in seconds"

          - name: campaign_id
            description: "FK to marketing campaign that drove this session, if any"

          - name: utm_source
            description: "UTM source parameter capturing traffic origin (e.g. email, google, direct)"

          - name: raw_device_metadata
            description: >
              Raw JSON string containing browser, OS, referrer, and A/B test
              group info. Needs parsing/flattening in Silver layer
              (browser, os, referrer, ab_test_group as separate columns).

# NEW TABLE 

      - name: bronze_customers 
        description: >
            Raw web session events loaded from CSV via Databricks Volumes.
            One row per session. Schema inferred at load time — types may
            drift if source CSV structure changes.
        tags: ['customers','bronze','pii_review_pending']

        meta: 
          owner: "karthick"
          team: "analytics_engineering"
          contains_pii: true
          source_system: "customers_csv_export"
          source_file_path: "dbfs:/Volumes/data_mart/source/my_volume/customers.csv"

        freshness:
          warn_after: { count: 24, period: hour}
          error_after: { count: 48, period: hour}  

        columns:
            - name: customer_id
              description: unique identifier for customers
              meta:
                contains_pii: true 
              data_tests:
                - unique
                - not_null 
            - name: customer_name
              description: Name of the customer
              data_test:
                - not_null
              meta:
                contains_pii: true
            - name: email
              description: email_address of the customers
              meta: 
                contains_pii: true
              data_test: 
                - not_null 
            - name: phone
              description: phone number of the customer
              data_tests: 
                - not_null
                - unique 
              meta:
                contains_pii: true
            - name: city
              description: city of the customer 
            - name: state
              description: state of the customer 
            - name: country 
              description: country of the customer 
            - name: signup_date 
              description: date when the customer signed up the 1st time. 
              data_tests:
                - not_null
          



        