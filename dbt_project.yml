# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_mart_360'
config-version : 2
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'data_mart_360'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.

on-run-start:
  - "{{ mask_customer_id() }}"

vars:
  employee_path: "dbfs:/Volumes/data_mart/source/my_volume/employees.csv"
  web_sessions_path: "dbfs:/Volumes/data_mart/source/my_volume/web_sessions.csv"
  customers_path: "dbfs:/Volumes/data_mart/source/my_volume/customers.csv"
  subscriptions_path: "dbfs:/Volumes/data_mart/source/my_volume/subscriptions.csv" 
  hr_attendance_path: "dbfs:/Volumes/data_mart/source/my_volume/hr_attendance.csv"
  date_path: "dbfs:/Volumes/data_mart/source/my_volume/date.csv"
  marketing_campaigns_path: "dbfs:/Volumes/data_mart/source/my_volume/marketing_campaigns.csv"
  payments_path: "dbfs:/Volumes/data_mart/source/my_volume/payments.csv"
  products_path:  "dbfs:/Volumes/data_mart/source/my_volume/products.csv"
  returns_path: "dbfs:/Volumes/data_mart/source/my_volume/returns.csv"
  inventory_path: "dbfs:/Volumes/data_mart/source/my_volume/inventory.csv"
  support_tickets_path: "dbfs:/Volumes/data_mart/source/my_volume/support_tickets.csv"

models:
  data_mart_360:
    # Config indicated by + and applies to all files under models/example/
    raw:
      +materialized: view
    staging:
      +materialized: view
    bronze:
      +materialized: table
    gold:
      +materialized: table


